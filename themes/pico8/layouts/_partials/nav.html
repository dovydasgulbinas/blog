<nav class="nav" aria-label="Main">
  <div class="wrap nav__inner">
    <a class="logo" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      <span class="snail" role="img" aria-label="Snail"></span>
      <span>dovydas<span class="logo__tld">.xyz</span></span>
    </a>
    <ul class="nav__links">
      {{- $page := . }}
      {{- range site.Menus.main }}
      {{- $current := $page.IsMenuCurrent "main" . }}
      {{- $inSection := and .Page (or ($page.HasMenuCurrent "main" .) (eq $page.Section (.Page.Section | default "_"))) }}
      <li><a href="{{ .URL }}"{{ if $current }} aria-current="page"{{ else if $inSection }} class="is-section"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </div>
</nav>
