{{- $u := urls.Parse .Destination }}
{{- $href := .Destination }}
{{- if and (not $u.IsAbs) $u.Path (not (hasPrefix $u.Path "/")) }}
  {{- with .PageInner.Resources.Get $u.Path }}{{ $href = .RelPermalink }}{{ end }}
{{- end -}}
<a href="{{ $href }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $u.IsAbs }} rel="noopener"{{ end }}>{{ .Text }}</a>
{{- /* chomp */ -}}
