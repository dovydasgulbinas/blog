# htmltest config for the built site. Path is passed on the command line.
CheckDoctype: true
CheckMetaRefresh: false        # Hugo alias pages use a bare meta refresh
IgnoreAltMissing: false
IgnoreAltEmpty: true          # alt="" marks decorative sprites and thumbnails
IgnoreDirectoryMissingTrailingSlash: true
IgnoreURLs:
  - "^http://localhost"
  - "^https://(www\\.)?(twitter|x|linkedin)\\.com/"   # block bots
ExternalTimeout: 20
CacheExpires: "24h"
