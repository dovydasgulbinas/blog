# Weekly update PRs. Hugo and the other site tools are pinned by flake.lock (`nix flake update`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    groups:
      test-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
