name: Site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Same Hugo as `nix develop`, pinned by flake.lock. Builds the site and runs htmltest.
      - name: Build site and check links (nix flake check)
        run: nix flake check -L

      - name: Copy built site
        run: |
          nix build -L
          cp -rL result _site
          chmod -R u+w _site

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The résumé PDF is printed from the built /resume/ page, so it always matches the HTML.
      - name: Build résumé PDF
        working-directory: tests
        run: node scripts/resume-pdf.mjs ../_site ../_site/resume/dovydas-gulbinas-resume.pdf

      - name: Playwright smoke tests
        working-directory: tests
        env:
          SITE_DIR: ../_site
        run: npx playwright test --project=desktop --project=phone

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
